<?xml version="1.0" encoding="UTF-8"?>
<!--
  <use> of a <symbol> and of a nested <svg> (#19). Laid out as a grid so the cases can be told apart in
  FoxgloveParserPreview.

  Row 1: a <symbol> with its own viewBox, instantiated via <use> at two different sizes - the viewBox scales
         independently each time, the way a nested <svg> would
  Row 2: a nested <svg> reused via <use> at its own declared size | the same <svg> with <use> overriding its
         width/height - the 50%-sized content inside grows to match the override, not the <svg>'s own size
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="360" height="240" viewBox="0 0 360 240">

  <defs>
    <symbol id="star" viewBox="0 0 100 100">
      <polygon points="50,3 61,37 97,37 68,58 79,92 50,71 21,92 32,58 3,37 39,37"
                fill="gold" stroke="#b8860b" stroke-width="3"/>
    </symbol>

    <svg id="halfBox" width="60" height="60" viewBox="0 0 60 60">
      <rect width="60" height="60" fill="lightgray" stroke="black"/>
      <rect width="50%" height="50%" fill="orange"/>
    </svg>
  </defs>

  <!-- Row 1: same symbol, two sizes -->
  <use xlink:href="#star" x="20" y="10" width="80" height="80"/>
  <use xlink:href="#star" x="140" y="0" width="140" height="140"/>

  <!-- Row 2: nested <svg> at its own size, then with <use> overriding width/height -->
  <use xlink:href="#halfBox" x="30" y="160"/>
  <use xlink:href="#halfBox" x="150" y="150" width="140" height="80"/>

</svg>

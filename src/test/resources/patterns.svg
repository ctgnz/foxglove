<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pattern paint servers (#17). Laid out as a grid so the cases can be told apart in FoxgloveParserPreview.

  Row 1: userSpaceOnUse tiling (checkerboard) | objectBoundingBox + viewBox, small target | the same pattern, wide target
  Row 2: patternContentUnits=objectBoundingBox (stripes, no viewBox)  | the same checker pattern on a stroke

  "dotSmall" and "dotWide" reference the *same* pattern element at two different sizes, to show a patternUnits=
  objectBoundingBox tile (the default) resolving independently against each target's own bounding box - the dot
  pattern is squeezed into "dotWide" rather than repeating more times, since 0.25 is a fraction of that shape's own
  width, not an absolute size.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="300" height="160" viewBox="0 0 300 160">

  <defs>
    <pattern id="checker" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="white"/>
      <rect width="5" height="5" fill="black"/>
      <rect x="5" y="5" width="5" height="5" fill="black"/>
    </pattern>

    <pattern id="dot" width="0.25" height="0.25" viewBox="0 0 1 1">
      <circle cx="0.5" cy="0.5" r="0.4" fill="teal"/>
    </pattern>

    <pattern id="stripes" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="0.2" height="1">
      <rect width="0.1" height="1" fill="purple"/>
    </pattern>
  </defs>

  <rect id="checkerFill" x="20" y="20" width="60" height="40" fill="url(#checker)"/>
  <rect id="dotSmall" x="100" y="20" width="40" height="40" fill="url(#dot)"/>
  <rect id="dotWide" x="160" y="20" width="100" height="40" fill="url(#dot)"/>

  <rect id="stripesFill" x="20" y="90" width="80" height="50" fill="url(#stripes)"/>
  <rect id="strokedWithPattern" x="120" y="90" width="60" height="50" fill="white"
        stroke="url(#checker)" stroke-width="8"/>

</svg>

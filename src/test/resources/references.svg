<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200" height="200" viewBox="0 0 200 200">

  <!-- a forward reference: the target is declared further down the document -->
  <use id="early" xlink:href="#box" x="10" y="10"/>

  <defs>
    <linearGradient id="base">
      <stop id="stop1" offset="0" stop-color="red"/>
      <stop id="stop2" offset="1" stop-color="blue"/>
    </linearGradient>
    <linearGradient id="derived" xlink:href="#base" x1="0" y1="0" x2="0" y2="1"/>
    <rect id="box" width="10" height="10"/>
  </defs>

  <g id="layer">
    <circle id="dot" cx="5" cy="5" r="2" fill="url(#derived)"/>
    <rect width="4" height="4"/>
  </g>

</svg>

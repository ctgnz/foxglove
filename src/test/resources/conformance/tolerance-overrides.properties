# Per-test overrides of ConformanceComparator's default differing-pixel-ratio tolerance (#44).
# testname=ratio, e.g. shapes-rect-01-t=0.05 for a legitimately borderline case.

# 8 shapes with curved/rounded edges - after #93's rx/ry fix, this matches the reference almost exactly on visual
# inspection (dumped via -Dconformance.debug=shapes-rect-01-t); the remaining ~3.3% is antialiasing noise along the
# curved perimeters, not a real mismatch - exactly the "legitimately borderline" case this override mechanism
# exists for.
shapes-rect-01-t=0.04

# After #94's points-list parsing fix, both match the reference almost exactly on visual inspection - the remaining
# small differences are antialiasing noise along diagonal/stroked polygon edges, confirmed via
# -Dconformance.debug=<name>, not a real mismatch.
painting-control-03-f=0.03
shapes-grammar-01-f=0.04

# After #115's arc-flag fix this renders all eight shapes in the right places with no red visible, which is the
# test's own stated pass criterion. Confirmed against the reference visually and via the report's diff panel: every
# shape's interior matches and only its curved perimeter differs, the same antialiasing noise shapes-rect-01-t above
# is allowed for. The ink figure agrees - the differing pixels are the test frame plus eight thin arcs, nothing else.
paths-data-20-f=0.03

# #160: was already borderline locally at 0.0199 (one ten-thousandth under the 0.02 default) before this override
# existed, purely from generic antialiasing noise like the entries above - and tips over to 0.0228 on the Linux/Xvfb
# CI runner, which is what made the live conformance dashboard flake between PASS and FAIL across otherwise-identical
# pushes. Measured directly, not guessed: downloaded the actual CI-rendered PNG and diff from the published dashboard
# (github.io) and counted pixels by the diff palette's own colours to get 0.0228 exactly, matching this test's own
# checked-in debug output locally (-Dconformance.debug=coords-units-03-b) at 0.0199. Comparing the two renders
# side by side, the difference is concentrated in exactly the two places the test's own passCriteria document already
# names as font-dependent: the centred title's glyph widths (a font substitution on Linux shifts every character
# relative to the reference, smearing the whole title in the diff) and the two ex/em-relative measurement lines,
# whose drawn length is computed from the chosen font's x-height and em-square. The rest of the canvas (left-anchored
# body text, the frame) matches almost exactly on both platforms.
coords-units-03-b=0.03

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200" height="200" color="green">

  <defs>
    <linearGradient id="linear" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="reflect">
      <stop offset="0" stop-color="red"/>
      <stop offset="0.5" stop-color="yellow" stop-opacity="0.5"/>
      <stop offset="1" stop-color="blue"/>
    </linearGradient>
    <radialGradient id="radial" cx="0.5" cy="0.5" r="0.5" fx="0.75" fy="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
  </defs>

  <rect id="viaAttribute" width="10" height="10" fill="url(#linear)"/>
  <rect id="viaStyle" width="10" height="10" style="fill:url(#radial)"/>
  <rect id="withFallback" width="10" height="10" fill="url(#missing) red"/>
  <rect id="noFallback" width="10" height="10" fill="url(#missing)"/>
  <rect id="currentColour" width="10" height="10" fill="currentColor"/>
  <rect id="explicitNone" width="10" height="10" fill="none"/>
  <rect id="strokedWithGradient" width="10" height="10" stroke="url(#linear)"/>

</svg>

name: Publish SVG conformance dashboard

# Runs after a merge to master, not on every PR build - the W3C conformance profile fetches and renders 525
# documents, too slow for the default per-push job (maven.yml), and a regression here shouldn't block a merge, only
# be visible in this workflow's own run and on the republished dashboard.
on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one dashboard deployment at a time; let an in-progress one finish rather than cancelling it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fetch latest browser-generated reference images
        # #198: W3cSvgConformanceCheck reads from here (conformance.reference.dir), not the suite's own stale png/ -
        # see #196/#197. A missing/unfetchable artifact is a harder failure than "the comparison found
        # regressions" below, so this step is not continue-on-error - it should stop the job clearly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow=generate-conformance-references.yml --status=success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful run of generate-conformance-references.yml found - trigger it manually first."
            exit 1
          fi
          gh run download "$RUN_ID" --repo ${{ github.repository }} -n w3c-svg-references -D target/w3c-svg-references-generated
      - name: Run the W3C SVG conformance suite
        id: conformance
        # Deliberately non-fatal here: the dashboard below must still publish (and show the regression) even when
        # this run's own manifest-diff assertion fails - the job is failed explicitly, after publishing, instead.
        continue-on-error: true
        run: xvfb-run --auto-servernum mvn -B -Pconformance test -Dconformance.mode=verify
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/conformance-report
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Fail this run if conformance regressed
        if: steps.conformance.outcome == 'failure'
        run: exit 1

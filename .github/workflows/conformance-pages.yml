name: Publish SVG conformance dashboard

# Runs after a merge to master, not on every PR build - the W3C conformance profile fetches and renders 525
# documents, too slow for the default per-push job (maven.yml), and a regression here shouldn't block a merge, only
# be visible in this workflow's own run and on the republished dashboard.
on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          conformance.mode - "verify" (default) checks against the checked-in baseline manifest; "record" (#199)
          re-baselines it instead, and this run's own manifest-diff assertion never fails (the check exits after
          writing the new baseline, before ever comparing against the old one) - download the "conformance-manifest"
          artifact this produces and commit it manually, reviewing what changed first.
        type: choice
        options: [verify, record]
        default: verify
      animationMode:
        description: >-
          animation.mode - same "verify"/"record" shape as `mode` above, independently chosen (#208), for the
          separate seeked-against-a-live-browser animation check (W3cSvgAnimationCheck) rather than the static one -
          "record" downloads as the "animation-manifest" artifact instead. Independent because the two checks
          measure genuinely different things and there is no reason re-baselining one should require re-baselining
          the other in the same run.
        type: choice
        options: [verify, record]
        default: verify

permissions:
  contents: read
  pages: write
  id-token: write

# Only one dashboard deployment at a time; let an in-progress one finish rather than cancelling it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fetch latest browser-generated reference images
        # #198: W3cSvgConformanceCheck reads from here (conformance.reference.dir), not the suite's own stale png/ -
        # see #196/#197. A missing/unfetchable artifact is a harder failure than "the comparison found
        # regressions" below, so this step is not continue-on-error - it should stop the job clearly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow=generate-conformance-references.yml --status=success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful run of generate-conformance-references.yml found - trigger it manually first."
            exit 1
          fi
          gh run download "$RUN_ID" --repo ${{ github.repository }} -n w3c-svg-references -D target/w3c-svg-references-generated
      - name: Run the W3C SVG conformance suite
        id: conformance
        # Deliberately non-fatal here: the dashboard below must still publish (and show the regression) even when
        # this run's own manifest-diff assertion fails - the job is failed explicitly, after publishing, instead.
        # In record mode there is no assertion to fail (the check returns right after writing the new baseline), so
        # this step's outcome is 'success' either way and the final gate step below is a no-op.
        continue-on-error: true
        run: xvfb-run --auto-servernum mvn -B -Pconformance test -Dconformance.mode=${{ inputs.mode || 'verify' }}
      - name: Run the W3C SVG animation conformance check
        id: animation
        # #208: was never wired into CI at all before this - the checked-in animation-manifest.properties had sat
        # unrefreshed since #112 first added it (still all-FAIL). Same continue-on-error reasoning as the static
        # check above: a regression here should be visible, not silently swallowed, but must not stop the dashboard
        # from publishing (the two checks are otherwise unrelated - this one produces no dashboard content of its
        # own, see W3cSvgAnimationCheck's own javadoc).
        continue-on-error: true
        run: xvfb-run --auto-servernum mvn -B -Pconformance test -Dtest=W3cSvgAnimationCheck -Danimation.mode=${{ inputs.animationMode || 'verify' }}
      - name: Upload recorded animation baseline
        # #208, same reasoning as the static manifest upload below: this job has no write access to commit directly,
        # so a record-mode run's only way out is an artifact - download and commit
        # src/test/resources/conformance/animation-manifest.properties by hand after reviewing the diff.
        if: inputs.animationMode == 'record'
        uses: actions/upload-artifact@v4
        with:
          name: animation-manifest
          path: src/test/resources/conformance/animation-manifest.properties
      - name: Upload recorded baseline manifest
        # #199: the only way to get a record-mode run's output back out of CI, since this job has no write access to
        # commit it directly - download this artifact and commit src/test/resources/conformance/manifest.properties
        # by hand after reviewing the diff, the same deliberate-not-automatic spirit as regenerating the reference
        # images themselves (#196/#197). Not copyrighted W3C content (see ConformanceManifest's own javadoc - "small,
        # our own data"), so an ordinary artifact upload, no durability/visibility concerns like #197's own.
        if: inputs.mode == 'record'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-manifest
          path: src/test/resources/conformance/manifest.properties
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/conformance-report
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Fail this run if conformance regressed
        if: steps.conformance.outcome == 'failure' || steps.animation.outcome == 'failure'
        run: exit 1

# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
    - name: Install Xvfb
      # Some tests (pattern rasterisation) start the JavaFX toolkit, which hangs rather than failing fast when no
      # display is available, as on a bare ubuntu-latest runner.
      run: sudo apt-get update && sudo apt-get install -y xvfb
    - name: Build with Maven
      run: xvfb-run --auto-servernum mvn -B clean verify
